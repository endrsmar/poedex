[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poedex"
version = "0.1.0"
description = "A modular Path of Exile assistant for Steam Deck gaming mode and desktop"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
poedex = "cli.main:main"

# Package discovery. `runtime` and `cli` are ordinary packages; `modules` is the
# vertical-slice tree from IMPLEMENTATION-PLAN §3, where only `modules/*/backend`
# is Python. `modules/*/ui` is TypeScript built by a separate toolchain, and
# `modules/*/tests` are not shipped.
[tool.hatch.build.targets.wheel]
packages = ["runtime", "cli", "modules"]
exclude = [
  "modules/*/ui",
  "modules/*/tests",
]

[tool.hatch.build.targets.sdist]
include = ["runtime", "cli", "modules", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Boundary tests deliberately build violating source trees as string literals.
"tests/test_boundaries.py" = ["E501"]
