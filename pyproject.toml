[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poedex"
version = "0.1.0"
description = "A modular Path of Exile assistant for Steam Deck gaming mode and desktop"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Phase 2. Both have to be vendorable into `py_modules/` for the Decky backend,
# which has no pip at install time (CLAUDE.md).
#   httpx         — pure Python, plus its own pure-Python deps (httpcore, h11, ...)
#   pydantic v2   — NOT pure Python: `pydantic-core` is a compiled Rust extension.
#                   A manylinux x86_64 wheel exists and the Deck is x86_64, so
#                   vendoring works, but it is a binary artefact pinned to a CPython
#                   ABI and Phase 7 has to check it against the Deck's Python.
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Phase 5. The web transport only. The Decky backend does not use these — its
# transport is Decky's own RPC — so they stay out of the base dependency set that
# has to be vendorable into `py_modules/`.
web = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
poedex = "cli.main:main"

# Package discovery. `runtime` and `cli` are ordinary packages; `modules` is the
# vertical-slice tree from IMPLEMENTATION-PLAN §3, where only `modules/*/backend`
# is Python. `modules/*/ui` is TypeScript built by a separate toolchain, and
# `modules/*/tests` are not shipped.
[tool.hatch.build.targets.wheel]
packages = ["runtime", "cli", "modules", "transports"]
exclude = [
  "modules/*/ui",
  "modules/*/tests",
]

[tool.hatch.build.targets.sdist]
include = ["runtime", "cli", "modules", "transports", "scripts", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
pythonpath = ["."]
# `modules/*/ui` is TypeScript with its own node_modules; nothing there is a Python
# test and walking it costs seconds on every run.
norecursedirs = ["node_modules", "dist", ".venv", "ui"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Boundary tests deliberately build violating source trees as string literals.
"tests/test_boundaries.py" = ["E501"]
